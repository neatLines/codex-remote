<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>RemoteHub</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 1. TOTP 2FA 登录视图 -->
  <div id="login-view" class="view hidden">
    <div class="login-ambient" aria-hidden="true"></div>
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2.5" ry="2.5"></rect>
            <polyline points="7 8 10 10.5 7 13"></polyline>
            <line x1="12" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <h1>RemoteHub</h1>
        <p class="subtitle">多设备 T3 Code 与本地服务远端控制中心</p>
      </div>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="login-password">访问口令</label>
          <input id="login-password" name="password" type="password" required placeholder="输入访问口令" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="login-totp">TOTP 6 位动态验证码</label>
          <input id="login-totp" name="totp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000" autocomplete="one-time-code" />
        </div>
        <div id="login-error" class="error-box hidden"></div>
        <button type="submit" id="login-submit" class="btn-primary full-width">安全登录（30 天免密）</button>
      </form>
    </div>
  </div>

  <!-- 2. 主控制台视图 (纯左侧可收缩侧栏 + 右侧 100% 全屏内嵌视图，无顶栏) -->
  <div id="app-view" class="view hidden">
    <!-- 移动端抽屉遮罩 -->
    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

    <!-- 侧栏收起时的贴边展开把手 -->
    <button id="btn-drawer" class="sidebar-expand-tab" type="button" title="展开左侧菜单栏" aria-label="展开左侧菜单栏">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    <!-- 左侧可折叠菜单栏 -->
    <aside id="sidebar-drawer" class="sidebar-drawer" aria-label="主菜单栏">
      <div class="drawer-top">
        <div class="drawer-brand">
          <span class="drawer-brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
          </span>
          <div class="drawer-brand-text">
            <div class="drawer-brand-title-row">
              <span class="drawer-brand-title">RemoteHub</span>
              <span id="ws-status-dot" class="status-dot offline" title="连接状态"></span>
            </div>
            <span id="current-workspace-badge" class="drawer-brand-sub">未选择设备</span>
          </div>
        </div>
        <button id="btn-collapse-sidebar" class="icon-btn icon-btn-sm" type="button" title="收起侧边栏" aria-label="收起侧边栏">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- 待信任的新设备提示 -->
      <div id="untrusted-banner" class="banner warning-banner hidden"></div>

      <div class="drawer-body">
        <!-- 设备节点选择区 -->
        <section class="drawer-section">
          <div class="drawer-section-header">
            <label for="agent-select">设备节点</label>
            <span id="agent-status-pill" class="status-pill">未连接</span>
          </div>
          <div class="select-wrap">
            <select id="agent-select" class="select-input"></select>
          </div>
          <div id="device-list" class="device-list"></div>
          <div id="sidebar-trust-box" class="sidebar-trust-box hidden">
            <span id="sidebar-trust-text">当前设备待授权</span>
            <button id="btn-sidebar-trust" type="button" class="btn-small">信任并绑定</button>
          </div>
        </section>

        <!-- 内嵌服务导航区 -->
        <section id="sidebar-services-section" class="drawer-section">
          <div class="drawer-section-header">
            <span>内嵌服务</span>
            <div class="drawer-section-tools">
              <span id="current-thread-title" class="sr-only">服务工作台</span>
              <button id="btn-device-apps" type="button" class="section-tool-btn hidden" title="返回服务卡片概览">概览</button>
              <button id="btn-reload-frame" type="button" class="section-tool-btn hidden" title="刷新当前内嵌页面">刷新</button>
              <a id="btn-open-external" class="section-tool-btn hidden" target="_blank" rel="noopener noreferrer" title="在新窗口打开当前服务">新窗口 ↗</a>
              <span id="services-count-badge" class="section-count">0</span>
            </div>
          </div>
          <div id="sidebar-services" class="sidebar-services-list"></div>
        </section>

        <!-- 通用本地端口直连区 -->
        <form id="local-web-form" class="drawer-section local-web-form hidden">
          <div class="drawer-section-header">
            <label for="local-web-url">端口直连</label>
          </div>
          <div class="local-web-controls">
            <input id="local-web-url" type="text" placeholder="端口或 http://127.0.0.1:3773" autocomplete="off" spellcheck="false" />
            <div class="local-web-btn-row">
              <button id="local-web-open" type="submit" class="btn-small full-width">内嵌打开</button>
              <button id="local-web-external" type="button" class="btn-ghost btn-sm" title="在新标签页打开">新窗口 ↗</button>
            </div>
          </div>
          <p id="local-web-error" class="local-web-hint" role="status">转发当前设备的 127.0.0.1 端口</p>
        </form>
      </div>

      <div class="drawer-footer">
        <button id="btn-files" type="button" class="btn-ghost drawer-footer-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>云端文件</span>
        </button>
        <button id="btn-logout" type="button" class="btn-ghost danger-text drawer-footer-btn" title="退出登录">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>退出</span>
        </button>
      </div>
    </aside>

    <!-- 右侧主工作区（无顶栏，100% 全屏高度） -->
    <div class="main-panel">
      <main class="workspace-stage">
        <iframe
          id="service-frame"
          class="service-frame hidden"
          title="内嵌远端服务"
          allow="clipboard-read; clipboard-write; fullscreen"
        ></iframe>

        <section id="device-apps" class="device-apps" aria-labelledby="device-apps-title">
          <div class="device-apps-shell">
            <div class="device-apps-header">
              <div class="device-hero-badge">REMOTE HUB</div>
              <h1 id="device-apps-title">等待设备连接</h1>
              <p id="device-apps-status" role="status"></p>
            </div>
            <h2 id="device-services-title" class="device-services-title hidden">可用网页服务</h2>
            <div id="app-cards" class="app-cards"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 云端文件弹窗 -->
  <div id="modal-files" class="modal-backdrop hidden">
    <section class="modal-card modal-large" aria-label="云端文件">
      <div class="modal-header-row">
        <div>
          <h3>云端文件存储</h3>
          <p class="modal-desc">受信任设备通过 <code>codex-up --upload</code> 上传的文件，设备离线后仍可下载。</p>
        </div>
        <button id="btn-close-files" type="button" class="btn-ghost btn-sm">关闭</button>
      </div>
      <div class="cloud-files-toolbar">
        <span id="files-storage" class="hint-text"></span>
        <button id="btn-refresh-files" type="button" class="btn-small">刷新列表</button>
      </div>
      <div id="files-status" class="hint-text" role="status" aria-live="polite"></div>
      <div id="files-list" class="cloud-files-list"></div>
      <button id="btn-more-files" type="button" class="btn-ghost full-width hidden">加载更多文件</button>
    </section>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
